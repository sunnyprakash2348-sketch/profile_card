<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>
    <link rel="stylesheet" href="profile_card.css">
    <style>
      .profile-section {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 40px;
        font-family: Arial, sans-serif;
      }
      .profile-card {
        background-color:aliceblue;
        border: 1px solid aliceblue;
        border-radius: 10px;
        width: 250px;
        text-align: center;
        padding: 20px;
      }
      .profile-card img {
        border-radius: 6%;
        width: 120px;
        height: 120px;
        margin-bottom: 15px;
      }
      #name1, #name2, #name3 {
        font-size: 1.4em;
        margin: 10px 0;
        color: black;
      }
      .role {
        font-size: 1.1em;
        color: black;
        margin-bottom: 10px;
      }
      .profile-card p {
        font-size: 0.95em;
        color: black;
      }

    </style>
</head>
<body>
  <section class="profile-section">
    <div class="profile-card">
      <img src="https://wallpapercave.com/wp/wp5231505.jpg" alt="Profile Picture">
      <h2 id="name1">Sunny Prakash</h2>
      <h3 class="role">Web Developer</h3>
      <p>Passionate about building responsive websites.</p>
    </div>
    <div class="profile-card">
      <img src="https://wallpapercave.com/wp/wp5231505.jpg" alt="Profile Picture">
      <h2 id="name2">Sunny Prakash</h2>
      <h3 class="role">UI/UX Designer</h3>
      <p>Designing user-friendly interfaces with creativity.</p>
    </div>
    <div class="profile-card">
      <img src="https://wallpapercave.com/wp/wp5231505.jpg" alt="Profile Picture">
      <h2 id="name3">Sunny Prakash</h2>
      <h3 class="role">Data Scientist</h3>
      <p>Turning data into meaningful insights.</p>
    </div>
  </section>  
</body>
</html>
